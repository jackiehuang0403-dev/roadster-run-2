<title>Roadster Run 2 · 飞跃车流</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#120a1e;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 6px #000a}
.hud .sc{font-size:34px;font-weight:800;letter-spacing:1px;line-height:1}
.hud small{display:block;font-size:12px;opacity:.75;font-weight:600;margin-top:4px}
.hud .r{text-align:right}
.hud .mph{font-size:22px;font-weight:800;color:#ffd24a}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a1240ee,#0a0612f2);padding:16px;overflow:auto}
#ov.hide{display:none}
.card{width:100%;max-width:440px;text-align:center}
h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:1px}
h1 b{color:#e82127}
.sub{opacity:.8;font-size:14px;margin:6px 0 16px}
.specs{display:flex;gap:8px;margin:0 0 14px}
.sp{flex:1;border:1px solid #ffffff2e;border-radius:14px;padding:12px 4px;background:#ffffff10}
.sp b{display:block;font-size:26px;color:#ffd24a;line-height:1.1}
.sp span{font-size:12px;opacity:.85}
.how{font-size:13.5px;line-height:1.7;text-align:left;background:#ffffff0d;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.how i{font-style:normal;color:#7fe0ff;font-weight:700}
button{font:inherit;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(#ff3b41,#c4141a);border:0;border-radius:30px;padding:14px 44px;min-height:52px;box-shadow:0 6px 20px #e8212188;cursor:pointer}
button:active{transform:scale(.97)}
.fine{font-size:11px;opacity:.55;margin-top:12px;line-height:1.5}
.big{font-size:56px;font-weight:900;color:#ffd24a;margin:4px 0}
.row{display:flex;justify-content:center;gap:24px;margin-bottom:18px;font-size:14px;opacity:.9}

</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud" style="display:none"><div><div class="sc" id="sc">0</div><small>最高 <span id="bs">0</span></small></div><div class="r"><div class="mph"><span id="mph">0</span> mph</div><small id="combo">&nbsp;</small></div></div>
<div id="ov"><div class="card" id="card"></div></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1,HOR=0,BASE=0,LW=0;
var CAM=6;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HOR=H*0.36;BASE=H*0.80;
  LW=Math.min(W*0.30,(BASE-HOR)*0.42);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,200)});resize();

var ls=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
var best=parseInt(ls('rr2_best'))||0;
var $=function(i){return document.getElementById(i)};
$('bs').textContent=best;

/* ---------- audio (tiny synth, optional) ---------- */
var AC=null;
function audio(){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d,type,vol,slide){try{if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),AC.currentTime+d);g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- state ---------- */
var S={mode:'intro',t:0,dist:0,speed:0,px:0,lane:1,h:0,vy:0,grav:9.9,air:false,rampAir:false,rolling:false,roll:0,rolled:false,
 ds:0,shield:0,mag:0,x2:0,inv:0,glide:0,gused:false,bonus:0,boost:0,objs:[],next:60,parts:[],texts:[],shake:0,dead:false,god:false,flips:0,jumps:0,bolts:0,startT:0,thr:0,combo:0};
function reset(){
  S.t=0;S.dist=0;S.speed=0;S.px=0;S.lane=1;S.h=0;S.vy=0;S.air=false;S.rampAir=false;S.rolling=false;S.roll=0;S.rolled=false;
  S.ds=0;S.shield=0;S.mag=0;S.x2=0;S.inv=0;S.glide=0;S.gused=false;S.bonus=0;S.boost=0;S.objs=[];S.next=70;S.parts=[];S.texts=[];S.shake=0;S.dead=false;S.flips=0;S.jumps=0;S.bolts=0;S.thr=0;S.combo=0;
}
function rnd(a,b){return a+Math.random()*(b-a)}
function ri(n){return Math.floor(Math.random()*n)}
var TESLA=['#e82127','#f2f2f2','#2b6cff','#222733','#c9ccd3','#14a37f'];

/* ---------- spawning ---------- */
function add(o){S.objs.push(o)}
function bolts(lane,z,n,h){for(var i=0;i<n;i++)add({k:'coin',lanes:[lane],lx:lane,z:z+i*3.2,h:h||0.35})}
function arc(lane,z,n,h0,h1){for(var i=0;i<n;i++)add({k:'coin',lanes:[lane],lx:lane,z:z+i*2.6,h:h0+(h1-h0)*Math.sin(Math.PI*i/(n-1))})}
var PU=['shield','mag','x2','nitro'];
function pu(lane,z,h){add({k:'pu',pt:PU[ri(4)],lanes:[lane],lx:lane,z:z,h:h||1.1})}
function spawn(){
  var z=S.dist+S.next+80,sp=S.speed,r=Math.random(),lvl=Math.min(1,S.t/40);
  var L=ri(3),L2=(L+1+ri(2))%3,L3=3-L-L2;
  if(S.t<6)r=0.05;
  var tA=(z-S.dist)/Math.max(sp,16),extra=0;
  if(r<.12){add({k:'bar',lanes:[L],lx:L,z:z,col:ri(6)});bolts(L2,z-4,5)}
  else if(r<.26){for(var i=0;i<3;i++)add({k:'car',lanes:[i],lx:i,z:z,col:ri(6)});arc(1,z-8,12,0.3,1.5)}
  else if(r<.38){add({k:'ramp',lanes:[L],lx:L,z:z});add({k:'semi',lanes:[L],lx:L,z:z+sp*0.72});bolts(L2,z,5);extra=sp*.7}
  else if(r<.52){add({k:'tr',lanes:[L],lx:L,z:z,vz:sp*.45,col:ri(6)});add({k:'tr',lanes:[L2],lx:L2,z:z+rnd(6,16),vz:sp*.4,col:ri(6)});arc(L3,z,9,0.3,1.2)}
  else if(r<.64&&S.t>8){var dir=Math.random()<.5?1:-1,Lt=ri(3);add({k:'cross',lanes:[Lt],lx:Lt-dir*1.5*tA,vlx:dir*1.5,z:z,col:ri(6)});add({k:'bar',lanes:[(Lt+1+ri(2))%3],lx:0,z:z+3,col:ri(6)});S.objs[S.objs.length-1].lx=S.objs[S.objs.length-1].lanes[0];arc(Lt,z-10,10,0.3,1.4)}
  else if(r<.76&&S.t>12){add({k:'on',lanes:[L],lx:L,z:z,vz:-20,col:ri(6)});add({k:'on',lanes:[L2],lx:L2,z:z+34,vz:-20,col:ri(6)});bolts(L3,z,6)}
  else if(r<.88){arc(L,z,14,0.3,1.6);pu(L,z+17,1.2)}
  else{add({k:'semi',lanes:[L],lx:L,z:z});add({k:'bar',lanes:[L2],lx:L2,z:z+6,col:ri(6)});bolts(L3,z,6)}
  if(Math.random()<.28)pu(ri(3),z-14,0.95);
  S.next+=Math.max(26,20+sp*0.75)*(1.18-lvl*0.25)+extra;
}

/* ---------- input ---------- */
function laneMove(d){if(S.mode!=='play'||S.dead)return;var n=Math.max(0,Math.min(2,S.lane+d));if(n!==S.lane){S.lane=n;beep(520,.08,'triangle',.05,1.4)}}
function jump(){
  if(S.mode!=='play'||S.dead)return;
  if(S.air){ if(!S.gused&&!S.rolling){S.gused=true;S.glide=0.85;S.thr=0.85;beep(260,.8,'sawtooth',.04,.7);ftext('推进器悬浮','#e9f6ff');puffs(1.2)} return }
  S.gused=false;S.glide=0;
  S.air=true;S.grav=9.9;S.vy=4.45;S.thr=0.35;S.jumps++;S.rampAir=false;
  beep(180,.35,'sawtooth',.05,.4);puffs(1.4);
}
function flip(){
  if(S.mode!=='play'||S.dead)return;
  if(S.air&&!S.rolling&&!S.rolled){S.rolling=true;S.roll=0;beep(300,.4,'square',.03,2)}
  else if(!S.air){jump()}
}
function puffs(n){
  var y=BASE-S.h*LW*0.7,x=W/2+S.px*LW;
  for(var i=0;i<n*8;i++)S.parts.push({x:x+rnd(-LW*.35,LW*.35),y:y-LW*.05,vx:rnd(-60,60),vy:rnd(60,220),life:rnd(.3,.6),m:.6,c:'#e9f6ff',s:rnd(3,8)});
}
var key={};
window.addEventListener('keydown',function(e){
  var k=e.key;audio();
  if(S.mode!=='play'){if(k==='Enter'||k===' '){if(!$('ov').classList.contains('hide')){start()}}return}
  if(k==='ArrowLeft'||k==='a'||k==='A')laneMove(-1);
  else if(k==='ArrowRight'||k==='d'||k==='D')laneMove(1);
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')jump();
  else if(k==='ArrowDown'||k==='s'||k==='S')flip();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0)e.preventDefault();
});
var tx=0,ty=0,tid=null,tt=0,moved=false;
function pdown(x,y,id){tx=x;ty=y;tid=id;tt=Date.now();moved=false}
function pmove(x,y,id){
  if(id!==tid||moved)return;
  var dx=x-tx,dy=y-ty,th=Math.max(22,Math.min(W,H)*0.045);
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  moved=true;
  if(Math.abs(dx)>Math.abs(dy))laneMove(dx>0?1:-1);else if(dy<0)jump();else flip();
}
function pup(id){
  if(id!==tid)return;tid=null;
  if(!moved&&Date.now()-tt<400)flip();
}
cv.addEventListener('touchstart',function(e){e.preventDefault();audio();var t=e.changedTouches[0];pdown(t.clientX,t.clientY,t.identifier)},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();var t=e.changedTouches[0];pmove(t.clientX,t.clientY,t.identifier)},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();pup(e.changedTouches[0].identifier)},{passive:false});
cv.addEventListener('touchcancel',function(e){tid=null});
if(!('ontouchstart' in window)){
  cv.addEventListener('mousedown',function(e){audio();pdown(e.clientX,e.clientY,'m')});
  window.addEventListener('mousemove',function(e){pmove(e.clientX,e.clientY,'m')});
  window.addEventListener('mouseup',function(){pup('m')});
}
['gesturestart','gesturechange','contextmenu'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
document.addEventListener('visibilitychange',function(){last=0});

/* ---------- UI ---------- */
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function intro(){
  S.mode='intro';reset();
  $('hud').style.display='none';$('ov').classList.remove('hide');
  $('card').innerHTML='<h1><b>ROADSTER</b> RUN 2</h1><div class="sub">飞跃车流 · 新一代 Roadster 喷气飞行挑战</div>'+
  '<div class="specs"><div class="sp"><b>0.55s</b><span>0–60 mph</span></div><div class="sp"><b>1500</b><span>马力 hp</span></div><div class="sp"><b>2028</b><span>计划量产</span></div></div>'+
  '<div class="how">'+(isTouch?
  '<i>左右滑</i> 换道　<i>上滑</i> 推进器起飞（空中再上滑＝悬浮滑翔），飞越特斯拉车阵<br><i>空中下滑 / 点屏</i> 喷气翻滚，翻完<b>稳稳落地</b>得奖励分<br>飞越行驶/对向/横穿的车流，空中收集金币与道具：<i>🛡护盾 🧲磁铁 ×2 双倍分 🚀氮气无敌</i>':
  '<i>← → / A D</i> 换道　<i>↑ / W / 空格</i> 推进器起飞（空中再按＝悬浮滑翔），飞越特斯拉车阵<br><i>空中 ↓ / S</i> 喷气翻滚，翻完<b>稳稳落地</b>得奖励分<br>飞越行驶/对向/横穿的车流，空中收集金币与道具：<i>🛡护盾 🧲磁铁 ×2 双倍分 🚀氮气无敌</i>')+'</div>'+
  '<button id="go">出发！</button><div class="fine">规格为 10 月 15 日发布会公布数据；本游戏为粉丝向非官方小游戏，<br>游戏中的速度、分数等均为游戏数值。</div>';
  $('go').onclick=function(){audio();start()};
}
function start(){reset();S.mode='play';S.startT=0;$('ov').classList.add('hide');$('hud').style.display='flex';$('bs').textContent=best}
function over(){
  S.dead=true;S.shake=1;beep(90,.6,'sawtooth',.12,.3);
  var sc=score(),nb=sc>best;if(nb){best=sc;ls('rr2_best',best)}
  setTimeout(function(){
    S.mode='over';
    $('card').innerHTML='<div style="font-size:18px;opacity:.8">撞车了！</div><div class="big">'+sc+'</div><div class="new">'+(nb?'🏆 新纪录！':'最高分 '+best)+'</div>'+
    '<div class="row"><span>跑了 '+Math.floor(S.dist*2)+' m</span><span>翻滚 '+S.flips+' 次</span><span>跳跃 '+S.jumps+' 次</span><span>⚡ '+S.bolts+'</span></div>'+
    '<button id="again">再来一局</button>';
    $('ov').classList.remove('hide');$('again').onclick=function(){audio();start()};
  },900);
}
function score(){return Math.floor(S.ds)+S.bonus}
function addB(n){S.bonus+=n*(S.x2>0?2:1)}
function ftext(t,c){S.texts.push({t:t,c:c||'#ffd24a',life:1.2,y:H*0.45})}

/* ---------- update ---------- */
function update(dt){
  if(S.mode!=='play'&&S.mode!=='intro'&&S.mode!=='over')return;
  S.t+=dt;
  if(S.mode==='intro'){S.dist+=dt*14;S.speed=14;S.px=Math.sin(S.t*0.7)*0.4;return}
  if(S.dead){S.shake*=0.92;S.speed*=0.9;S.dist+=S.speed*dt;return}
  var target=15+Math.min(25,S.t*0.45);
  var launch=Math.min(1,S.t/0.55); // 0-60 in 0.55s
  S.boost=Math.max(0,S.boost-dt);
  var v=target*(S.boost>0?1.5:1)*launch;
  S.speed+=(v-S.speed)*Math.min(1,dt*8);
  S.dist+=S.speed*dt;S.ds+=S.speed*dt*2*(S.x2>0?2:1);
  S.shield=Math.max(0,S.shield-dt);S.mag=Math.max(0,S.mag-dt);S.x2=Math.max(0,S.x2-dt);S.inv=Math.max(0,S.inv-dt);
  S.px+=((S.lane-1)-S.px)*Math.min(1,dt*12);
  // vertical
  if(S.air){
    if(S.glide>0){S.glide-=dt;S.vy+=(0.35-S.vy)*Math.min(1,dt*7);if(Math.random()<.9)puffs(.2)}
    else S.vy-=S.grav*dt;
    S.h+=S.vy*dt;
    if(S.rolling){S.roll+=dt/0.55*Math.PI*2;if(S.roll>=Math.PI*2){S.roll=0;S.rolling=false;S.rolled=true;
        var b=S.rampAir?500:150;addB(b);S.flips++;S.combo++;ftext('翻滚！ +'+b,'#7fe0ff');beep(660,.25,'triangle',.07,2)}}
    if(S.h<=0){
      S.h=0;S.air=false;S.vy=0;
      if(S.rolling){S.rolling=false;S.roll=0}
      if(S.rolled){var lb=S.rampAir?300:200;addB(lb);S.combo++;ftext('稳稳落地！ +'+lb,'#7dff9b');beep(520,.3,'triangle',.07,1.6)}
      S.rolled=false;S.rampAir=false;S.glide=0;S.shake=Math.max(S.shake,0.25);puffs(.8);beep(110,.15,'sine',.1,.5)
    }
  }
  if(S.thr>0)S.thr-=dt;
  if(S.air&&S.thr>0&&Math.random()<.8)puffs(.25);
  if(S.boost>0&&Math.random()<.7){var x=W/2+S.px*LW,y=BASE-S.h*LW*0.7;S.parts.push({x:x+rnd(-LW*.3,LW*.3),y:y,vx:rnd(-30,30),vy:rnd(80,200),life:.35,m:.5,c:Math.random()<.5?'#ffb23a':'#ff5a2a',s:rnd(4,9)})}
  // objects
  var pl=Math.round(S.px+1),inv=S.inv>0||S.boost>0||S.god;
  for(var i=S.objs.length-1;i>=0;i--){
    var o=S.objs[i];
    if(o.vz)o.z+=o.vz*dt;if(o.vlx)o.lx+=o.vlx*dt;
    var d=o.z-S.dist;
    if(d<-8||o.lx<-3||o.lx>5){S.objs.splice(i,1);continue}
    if(o.done)continue;
    if((o.k==='coin'||o.k==='pu')&&S.mag>0&&d<16&&d>-1&&Math.abs(o.lx-(S.px+1))<2.2){o.lx+=((S.px+1)-o.lx)*Math.min(1,dt*7);o.h+=((S.h+.3)-o.h)*Math.min(1,dt*7);o.z-=14*dt}
    if(d<0.7&&!o.passed){
      if(d<-0.7)o.passed=true;
      var hit=o.lanes.length>1?o.lanes.indexOf(pl)>=0:Math.abs(S.px-(o.lx-1))<(o.k==='coin'||o.k==='pu'?0.75:0.6);
      if(!hit)continue;
      if(o.k==='coin'){if(Math.abs(S.h-o.h)<0.8){o.done=true;S.bolts++;addB(10);beep(900+Math.min(S.bolts%8,7)*60,.08,'square',.035)}}
      else if(o.k==='pu'){if(Math.abs(S.h-o.h)<0.85){o.done=true;beep(700,.3,'triangle',.08,2);
        if(o.pt==='shield'){S.shield=14;ftext('护盾！抵挡一次撞击','#6fd8ff')}
        else if(o.pt==='mag'){S.mag=10;ftext('磁铁！吸附金币','#ff7ae0')}
        else if(o.pt==='x2'){S.x2=10;ftext('得分 ×2','#7dff9b')}
        else{S.boost=3.5;S.shake=.4;ftext('氮气冲刺！无敌','#ffb23a')}}}
      else if(o.k==='ramp'){if(!S.air){o.done=true;S.air=true;S.grav=9.4;S.vy=6.6;S.rampAir=true;S.thr=.5;S.rolled=false;S.gused=false;S.glide=0;S.jumps++;ftext('起飞！下滑翻滚','#ffffff');beep(240,.5,'sawtooth',.05,.4);puffs(1.5)}}
      else{
        var oh=o.k==='semi'?1.7:(o.k==='bar'?0.55:0.6);
        if(S.h<oh-0.02){
          if(S.boost>0||S.god){o.done=true;addB(50);S.shake=.3;puffs(1);beep(150,.2,'square',.06,.5);ftext('撞飞！+50','#ffb23a')}
          else if(S.shield>0){S.shield=0;S.inv=1.2;o.done=true;S.shake=.6;puffs(2);beep(200,.4,'sawtooth',.08,.4);ftext('护盾抵消！','#6fd8ff')}
          else if(S.inv<=0){over();return}
        }
      }
    }
  }
  // spawn
  while(S.dist+S.next-S.dist<0||S.objs.length<4||lastZ()<S.dist+130){spawn();if(S.objs.length>60)break}
  // particles
  for(var j=S.parts.length-1;j>=0;j--){var p=S.parts[j];p.life-=dt;if(p.life<=0){S.parts.splice(j,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt}

function drawObjs(){

      else if(o.k==='on')frontCar(x,gy,w,TESLA[o.col%6]);
      else if(o.k==='cross')sideCar(x,gy,w,TESLA[o.col%6],o.vlx>0?1:-1);
      else if(o.k==='bar')barrier(x,gy,w,o.col);

    }

}
function render(){

  ctx.restore();
}
